name: Needle CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: |
          android --no-metrics sdk install platforms/android-37.0
          android --no-metrics sdk install build-tools/36.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build, test and analyze
        run: bash ./gradlew testFdroidDebugUnitTest lintFdroidDebug assembleFdroidDebug assembleFdroidRelease --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: needle-debug-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: needle-reports
          path: |
            app/build/reports/
            app/build/test-results/
