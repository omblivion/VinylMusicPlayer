apply plugin: 'com.android.application'
// Data Binding still requires kapt; use AGP's bridge for built-in Kotlin.
apply plugin: 'com.android.legacy-kapt'

// For dependencies license report
// To use: ./gradlew license<BuildVariant>Report
apply plugin: 'com.cmgapps.licenses'
licenses {
    reports {
        // Enable this JSON generation to get the full data structure
        // json {
        //    enabled = true
        //    destination = file("$buildDir/reports/licenses/dependencies-licenses.json")
        //}

        html.enabled = false // html is enabled by default

        // Generate CSV format
        custom {
            enabled = true
            destination = file("$buildDir/reports/licenses/dependencies-licenses.csv")
            generate {
                final Collection list -> list.collect{
                    [
                        (it.mavenCoordinates.groupId + '.' + it.mavenCoordinates.artifactId) + (it.name != null ? ' - ' + it.name : ''),
                        it.description != null ? it.description.replaceAll('[;\\n\\r]+', ' ') : '',
                        it.licenses[0] != null ? it.licenses[0].name : '',
                        it.licenses[0] != null ? it.licenses[0].url : '',
                    ].join(';')
                }.join('\n') }
        }
    }
}

android {
    compileSdk 37
    namespace 'com.poupa.vinylmusicplayer'
    defaultConfig {
        minSdk 34
        targetSdk 37

        applicationId 'org.needlemusicplayer.android'
        versionCode 2
        versionName '0.0.2'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix ' DEBUG'
        }
    }
    signingConfigs {
        ci {
            final File keystorePropertiesFile = rootProject.file('keystore.properties')
            if (keystorePropertiesFile.exists()) {
                final Properties keystoreProperties = new Properties()
                keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    flavorDimensions = ['default']
    productFlavors {
        playStore {
            dimension 'default'
            if (rootProject.file('keystore.properties').exists()) signingConfig signingConfigs.ci
        }
        fdroid {
            dimension 'default'
        }
        ci {
            dimension 'default'

            final String gitBranch = providers.exec {commandLine('git', 'rev-parse', '--abbrev-ref', 'HEAD')}.standardOutput.asText.get().trim()
            final String gitSha1 = providers.exec {commandLine('git', 'rev-parse', '--short', 'HEAD')}.standardOutput.asText.get().trim()
            final String buildTime = new Date().format('yyMMdd-HHmm')
            final String buildId = gitBranch + '_' + gitSha1 + '_' + buildTime

            applicationIdSuffix '.ci'
            versionNameSuffix '-' + buildId + ' CI'
            if (rootProject.file('keystore.properties').exists()) signingConfig signingConfigs.ci
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig true
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
    lint {
        abortOnError true
        // Track inherited debt explicitly; new findings still fail CI.
        baseline = file('lint-baseline.xml')
        disable 'MissingTranslation', 'InvalidPackage'
    }
}

kotlin {
    jvmToolchain(17)
}

